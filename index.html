<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>PlateView ⚾ | MLB Live Scores &amp; Stats</title>
    <meta name="description" content="A lightweight, zero-latency, open-source MLB live scoreboard and stats explorer" />
    <script>
      // Apply the saved theme and language before first paint so a returning
      // visitor never sees a flash of the light / English defaults.
      try {
        var root = document.documentElement;
        if (localStorage.getItem('plateview_mode') === 'dark') {
          root.classList.add('dark');
          root.setAttribute('data-mode', 'dark');
        }
        if (localStorage.getItem('plateview_lang') === 'zh') root.lang = 'zh-TW';
      } catch (e) {}
    </script>
  </head>
  <body class="bg-page text-main min-h-screen transition-colors duration-200 antialiased selection:bg-team-primary selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
